[package]
name = "ai-premiere-boot"
description = "Starts AI Видео in the browser from compressed parts of its WebAssembly"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false

[lints]
workspace = true

[[bin]]
# The shipped file names (ai-premiere-<hash>.js / _bg.wasm) come from this name.
name = "ai-premiere"
path = "src/main.rs"

[dependencies]
# Inflates the parts in browsers without `DecompressionStream`.
flate2 = { workspace = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
# The same wasm-bindgen as the app (one CLI version builds both).
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
web-sys = { version = "0.3", features = ["Window", "Document", "Element", "Node", "Location", "Performance", "Request", "RequestInit", "RequestCache", "Response", "Headers", "Blob", "ReadableStream", "WritableStream", "ReadableWritablePair", "Url", "console"] }
